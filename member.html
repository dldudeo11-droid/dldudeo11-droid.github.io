<!DOCTYPE html>
<html lang="ko" data-theme="editorial">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 구 주소(member.html?id=...) → 단원별 정적 페이지(members/<id>.html)로 이동시키는 페이지.
       자체 색인은 막고 링크만 따라가게 둔다. -->
  <meta name="robots" content="noindex,follow" />
  <title>단원 프로필 · 대구 비르투오조 챔버</title>
  <meta name="description" content="대구 비르투오조 챔버 단원 프로필 페이지로 이동합니다." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    (function () {
      var id = new URLSearchParams(location.search).get("id");
      var to = id ? "members/" + encodeURIComponent(id) + ".html" : "members.html";
      location.replace(to);
    })();
  </script>
</head>
<body data-page="member-redirect">
  <main>
    <section class="pagehead wrap" style="padding-top:130px">
      <p class="lead">단원 프로필 페이지로 이동합니다.</p>
      <p><a class="back-link" href="members.html">단원 목록으로 →</a></p>
    </section>
  </main>
</body>
</html>
